[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse4d"
version = "2.5.0"
description = "Multi-Dimensional Cognitive State Matrix with Bi-temporal Modeling, Local-First SQLite/Markdown, and Autonomous Topological Self-Assembly"
readme = "README.md"
authors = [{ name = "Ángel Ruiz (@MShesat)" }]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research"
]
dependencies = [
    "filelock>=3.12.0",
    "pydantic>=2.0.0",
    "fastembed>=0.9.0",
    "onnxruntime>=1.14.0",
    "numpy>=1.22.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "hypothesis>=6.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
synapse4d = "synapse4d.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["synapse4d*"]
